<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="김세현의 개인 홈페이지입니다. 서울대학교 첨단융합학부 26학번.">
  <title>김세현 | 개인 홈페이지</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%231a4f8b'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-size='32' font-family='sans-serif' fill='white'%3EK%3C/text%3E%3C/svg%3E">
  <style>
    :root { --ink:#152238; --muted:#58677b; --line:#dce4ef; --paper:#f6f8fb; --accent:#1a4f8b; --accent-light:#e7f0fa; }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; color:var(--ink); background:var(--paper); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; line-height:1.7; }
    .wrap { width:min(100% - 2rem,760px); margin:0 auto; padding:1.25rem 0 3rem; }
    header { display:flex; align-items:center; justify-content:space-between; padding:.75rem 0 2.5rem; font-size:.95rem; }
    .brand { font-weight:750; letter-spacing:-.02em; }
    nav a { color:var(--muted); text-decoration:none; margin-left:1rem; }
    nav a:hover,nav a:focus-visible { color:var(--accent); }
    main { background:#fff; border:1px solid var(--line); border-radius:1.25rem; overflow:hidden; box-shadow:0 12px 32px rgba(22,43,76,.06); }
    .hero { padding:clamp(2.5rem,8vw,5rem) clamp(1.5rem,7vw,4.5rem); background:linear-gradient(135deg,#f5f9ff 0%,#fff 65%); border-bottom:1px solid var(--line); }
    .eyebrow { display:inline-block; margin:0 0 1rem; padding:.3rem .7rem; border-radius:999px; color:var(--accent); background:var(--accent-light); font-size:.9rem; font-weight:700; }
    h1,h2 { letter-spacing:-.045em; line-height:1.2; }
    h1 { margin:0; font-size:clamp(2.5rem,9vw,4.8rem); }
    .lead { max-width:34rem; margin:1.25rem 0 0; color:var(--muted); font-size:clamp(1.05rem,3vw,1.25rem); }
    .content { padding:clamp(1.5rem,6vw,3.5rem); }
    section + section { margin-top:2.5rem; padding-top:2.5rem; border-top:1px solid var(--line); }
    h2 { margin:0 0 .9rem; font-size:1.45rem; }
    .profile { display:grid; grid-template-columns:7rem 1fr; gap:1rem 1.5rem; }
    .label { color:var(--muted); font-weight:650; }
    .contact { display:flex; align-items:center; justify-content:space-between; gap:1rem; padding:1.25rem; border-radius:.9rem; background:#f7faff; }
    .contact span { color:var(--muted); font-size:.92rem; }
    .contact a { overflow-wrap:anywhere; color:var(--accent); font-weight:700; text-underline-offset:.18em; }
    footer { padding:1.7rem 0 0; color:var(--muted); text-align:center; font-size:.88rem; }
    @media (max-width:480px) { header { padding-bottom:1.5rem; } nav a { margin-left:.65rem; } .profile { grid-template-columns:1fr; gap:.25rem; } .contact { display:block; } .contact a { display:block; margin-top:.3rem; } }
  </style>
</head>
<body>
  <div class="wrap">
    <header><div class="brand">김세현</div><nav aria-label="페이지 내비게이션"><a href="#about">소개</a><a href="#contact">연락처</a></nav></header>
    <main>
      <section class="hero" aria-labelledby="home-title"><p class="eyebrow">Personal homepage</p><h1 id="home-title">김세현</h1><p class="lead">서울대학교 첨단융합학부 26학번입니다.</p></section>
      <div class="content">
        <section id="about" aria-labelledby="about-title"><h2 id="about-title">소개</h2><div class="profile"><span class="label">소속</span><span>서울대학교 첨단융합학부</span><span class="label">학번</span><span>26학번</span></div></section>
        <section id="contact" aria-labelledby="contact-title"><h2 id="contact-title">이메일</h2><div class="contact"><span>문의나 연락은 이메일로 보내 주세요.</span><a href="mailto:sehyeon07@snu.ac.kr">sehyeon07@snu.ac.kr</a></div></section>
      </div>
    </main>
    <footer>© 2026 김세현</footer>
  </div>
</body>
</html>
